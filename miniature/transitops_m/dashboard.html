<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TransitOps-M Simulator</title>
<style>body{font:16px system-ui;background:#0d1726;color:#edf4fa;max-width:1000px;margin:32px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}section{border:1px solid #4a5b71;background:#17273c;border-radius:12px;padding:20px}button{cursor:pointer;background:#178b98;color:white;border:0;padding:10px;border-radius:5px;margin:3px}.danger{background:#b83b4d}pre{white-space:pre-wrap;max-height:300px;overflow:auto}small{color:#b9c8d7}#error{color:#ff9e9e}.pill{display:inline-block;border:1px solid #6b819b;border-radius:20px;padding:7px;margin:4px}</style></head>
<body><h1>TransitOps-M</h1><p>HO-scale miniature city • <strong>Simulation only</strong> — no physical hardware attached.</p>
<div class="grid"><section><h2>Network</h2><svg viewBox="0 0 560 320" width="100%" role="img" aria-label="Route diagram with two stations and depot"><rect x="40" y="42" width="480" height="230" rx="90" stroke="#53677c" stroke-width="30" fill="none"/><rect x="40" y="42" width="480" height="230" rx="90" stroke="#efcb72" stroke-dasharray="8 9" stroke-width="2" fill="none"/><rect x="95" y="5" width="140" height="35" rx="5" fill="#8baec5"/><text x="109" y="28" fill="#112132">Station A</text><rect x="350" y="277" width="138" height="34" rx="5" fill="#8baec5"/><text x="361" y="298" fill="#112132">Station B</text><rect x="181" y="109" width="199" height="105" rx="8" fill="#2d4765"/><text x="201" y="140" fill="white">Depot 1</text><text x="201" y="161" fill="#d5deea">Parking P1 / P2</text><rect id="bus" x="0" y="0" width="30" height="17" rx="5" fill="#2ac1ca" stroke="white"/></svg><div id="summary"></div></section>
<section><h2>Commands</h2><button onclick="command('tick',{steps:1})">Tick +1</button><button onclick="command('tick',{steps:20})">Tick +20</button><button onclick="command('return')">Reserve depot</button><button onclick="command('dock')">Confirm mock dock</button><button onclick="command('dispatch')">Release</button><button class="danger" onclick="command('stop')">Emergency stop</button><button onclick="command('clear')">Clear interlock</button><button onclick="command('reset')">Reset fault</button><p id="error"></p><h3>Events</h3><pre id="events"></pre></section></div>
<script>
const el=id=>document.getElementById(id);
async function command(command,extra={}){try{const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error);el('error').textContent='';render(d)}catch(e){el('error').textContent=e.message}}
function render(d){const b=d.buses['BUS-01'];const t=b.distance*Math.PI*2-Math.PI/2;el('bus').setAttribute('x',280+226*Math.cos(t)-15);el('bus').setAttribute('y',157+113*Math.sin(t)-8);el('summary').textContent='';for(const v of ['Tick '+d.tick,b.state,'Virtual battery '+b.battery+'%','Depot '+(d.bays['DEPOT-1'].occupied_by||d.bays['DEPOT-1'].reserved_for||'free')]){const s=document.createElement('span');s.className='pill';s.textContent=v;el('summary').append(s)}el('events').textContent=JSON.stringify(d.events.slice(-10).reverse(),null,2)}
fetch('/api/state').then(r=>r.json()).then(render).catch(e=>el('error').textContent=e.message)
</script></body></html>
