name: Scenario playground checks
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/scenario-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/scenario-checks.yml"
permissions:
  contents: read
jobs:
  scenario-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -c 'import pathlib, tomllib; p = pathlib.Path("backend/pyproject.toml"); print(*tomllib.loads(p.read_text())["project"]["dependencies"], sep=chr(10))' > "$RUNNER_TEMP/transitops-requirements.txt"
          python -m pip install -r "$RUNNER_TEMP/transitops-requirements.txt" "httpx>=0.27,<1"
      - name: Python scenario regression tests
        run: cd backend && python -m unittest discover -s tests -p "test_*.py" -v
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build frontend
        run: npm install && npm run build
      - name: Motion core tests (parity with the Python simulator)
        run: npm run test:motion
