name: SUMO integration

permissions:
  contents: read

concurrency:
  group: sumo-integration-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "docker-compose.yml"
      - ".github/workflows/sumo-integration.yml"
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production SUMO image
        run: docker build -f simulation/Dockerfile -t transitops-sumo .

      - name: Validate baked network and traffic
        run: docker run --rm transitops-sumo python smoke_test.py

      - name: Inspect generated asset sizes
        run: |
          docker create --name transitops-assets transitops-sumo
          docker cp transitops-assets:/app/simulation/sumo/network/waterloo_corridor.net.xml.gz ./waterloo_corridor.net.xml.gz
          docker cp transitops-assets:/app/simulation/sumo/routes/waterloo_corridor.rou.xml ./waterloo_corridor.rou.xml
          docker rm transitops-assets
          ls -lh waterloo_corridor.net.xml.gz waterloo_corridor.rou.xml

      - name: Upload SUMO assets
        uses: actions/upload-artifact@v4
        with:
          name: waterloo-corridor-sumo-assets
          path: |
            waterloo_corridor.net.xml.gz
            waterloo_corridor.rou.xml
          retention-days: 7
