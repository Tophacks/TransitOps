name: SUMO integration

on:
  push:
    branches: [main]
    paths:
      - "simulation/**"
      - "docker-compose.yml"
      - ".github/workflows/sumo-integration.yml"
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production SUMO image
        run: docker build -f simulation/Dockerfile -t transitops-sumo .

      - name: Validate baked network and traffic
        run: docker run --rm transitops-sumo python smoke_test.py

      - name: Inspect generated asset sizes
        run: |
          docker create --name transitops-assets transitops-sumo
          docker cp transitops-assets:/app/simulation/sumo/network/waterloo_kitchener.net.xml.gz ./waterloo_kitchener.net.xml.gz
          docker cp transitops-assets:/app/simulation/sumo/routes/background.rou.xml.gz ./background.rou.xml.gz
          docker rm transitops-assets
          ls -lh waterloo_kitchener.net.xml.gz background.rou.xml.gz

      - name: Upload SUMO assets
        uses: actions/upload-artifact@v4
        with:
          name: waterloo-kitchener-sumo-assets
          path: |
            waterloo_kitchener.net.xml.gz
            background.rou.xml.gz
          retention-days: 7
